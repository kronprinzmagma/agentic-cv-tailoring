[project]
name = "cv-tailor"
version = "0.1.0"
description = "Multi-agent pipeline for tailoring a CV to a specific job posting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "litellm>=1.50",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "playwright>=1.59.0",
  "pypdf>=6.11.0",
  # Security fixes — pin transitive deps to patched versions
  "urllib3>=2.7.0",
  "aiohttp>=3.14.0",
  "idna>=3.15",
]

[project.scripts]
cv-tailor = "cv_tailor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_tailor"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Enges, report-orientiertes Regelset: faengt genau die Klasse Fehler, die in
# den Code-Reviews auftauchte (broad-except, Bugbear-Muster, ungenutzte Imports,
# veraltete Idiome). Nicht blockierend — die CI laeuft im Report-Modus
# (ruff check --exit-zero), Befunde sind Hinweis, kein Gate. "adopt, don't build".
select = ["E", "F", "I", "B", "BLE", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests live in tests/ and address the deterministic layer of cv-tailor:
# regex helpers, validators, language detection, topic classification,
# cost/quality aggregation, etc. LLM-driven agents are covered by the
# eval-suite (evals/run.py), not pytest, because they need real runs.
